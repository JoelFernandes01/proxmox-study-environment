---
- name: Preparação base do Ubuntu para Docker Swarm
  hosts: swarm
  become: true
  gather_facts: true

  tasks:
    - name: Configurar fuso horário
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Atualizar cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Atualizar pacotes
      apt:
        upgrade: dist
        autoremove: yes

    - name: Instalar chrony
      apt:
        name: chrony
        state: present

    - name: Configurar chrony
      copy:
        dest: /etc/chrony/chrony.conf
        content: |
          {% for server in ntp_servers %}
          pool {{ server }} iburst
          {% endfor %}
          driftfile /var/lib/chrony/chrony.drift
          rtcsync
          makestep 1 3
      notify: restart chrony

    - name: Habilitar chrony
      systemd:
        name: chrony
        enabled: yes
        state: started

    - name: Instalar ferramentas essenciais
      apt:
        name:
          - vim
          - nano
          - htop
          - ncdu
          - curl
          - wget
          - net-tools
          - dnsutils
          - traceroute
          - mtr-tiny
          - git
          - jq
          - yq
          - tree
          - unzip
          - bash-completion
        state: present

    - name: Desabilitar swap (runtime)
      command: swapoff -a
      changed_when: false

    - name: Desabilitar swap (fstab)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Carregar módulos de kernel
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persistir módulos
      copy:
        dest: /etc/modules-load.d/docker.conf
        content: |
          overlay
          br_netfilter

    - name: Configurar sysctl
      copy:
        dest: /etc/sysctl.d/99-docker.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      notify: reload sysctl

    - name: Instalar UFW
      apt:
        name: ufw
        state: present

    - name: Regras UFW TCP
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ swarm_ports_tcp }}"

    - name: Regras UFW UDP
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ swarm_ports_udp }}"

    - name: Ativar UFW
      ufw:
        state: enabled
        policy: deny

    - name: Configurar HISTTIMEFORMAT
      blockinfile:
        path: /etc/bash.bashrc
        block: |
          export HISTTIMEFORMAT="%F %T "
          export HISTSIZE=100000
          export HISTFILESIZE=200000

  handlers:
    - name: restart chrony
      systemd:
        name: chrony
        state: restarted

    - name: reload sysctl
      command: sysctl --system
