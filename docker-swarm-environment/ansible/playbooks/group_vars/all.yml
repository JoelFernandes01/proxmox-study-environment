---
# ========================================================================
# Variáveis globais — Docker Swarm
# ========================================================================
# --- Rede ---
swarm_network: "10.0.39.0/24"
swarm_gateway: "10.0.39.1"
swarm_manager_ip: "10.0.39.31"

# --- NTP ---
ntp_servers:
  - a.st1.ntp.br
  - b.st1.ntp.br
  - pool.ntp.org

# --- Fuso horário ---
timezone: "America/Sao_Paulo"

# --- Firewall (portas do Swarm) ---
swarm_ports_tcp:
  - 22      # SSH Host
  - 2377    # Swarm Cluster
  - 7946    # Swarm Communication
  - 80      # HTTP / Traefik
  - 443     # HTTPS / Traefik
  - 2049    # NFS Protocol
  - 111     # RPC / Portmapper
  - 2222    # GitLab SSH

swarm_ports_udp:
  - 7946
  - 4789
  - 111

# --- Docker ---
docker_version: "latest"

# --- Traefik ---
traefik_version: "v2.11"
traefik_domain: "nverse.local"
traefik_email: "ti@nverse@.com.br"

# --- Portainer ---
portainer_version: "latest"
portainer_domain: "portainer.nverse.local"
