---
# =========================================================================
# Playbook 05 — Implantar Stacks de Infraestrutura e CI/CD com NFS
# =========================================================================

- name: Implantar Stacks no Docker Swarm
  hosts: managers[0]
  become: true
  gather_facts: false
  tasks:
    - name: Criar rede overlay publica do Traefik
      command: docker network create --driver=overlay --attachable traefik-public
      register: net_result
      failed_when:
        - net_result.rc != 0
        - "'already exists' not in net_result.stderr"
      changed_when: "'already exists' not in net_result.stderr"

    - name: Criar diretorio temporario para os manifestos
      file:
        path: /tmp/stacks
        state: directory
        mode: '0755'

    - name: Renderizar templates das Stacks
      template:
        src: "{{ item.src }}"
        dest: "/tmp/stacks/{{ item.dest }}"
      loop:
        - { src: "templates/traefik.yml.j2", dest: "traefik.yml" }
        - { src: "templates/portainer.yml.j2", dest: "portainer.yml" }
        - { src: "templates/cicd-pipeline.yml.j2", dest: "cicd-pipeline.yml" }

    - name: Deploy da Stack Traefik
      command: docker stack deploy -c /tmp/stacks/traefik.yml traefik

    - name: Deploy da Stack Portainer (com NFS)
      command: docker stack deploy -c /tmp/stacks/portainer.yml portainer

    - name: Deploy da Stack CI/CD Jenkins e SonarQube (com NFS)
      command: docker stack deploy -c /tmp/stacks/cicd-pipeline.yml cicd

    - name: Aguardar inicializacao das stacks
      pause:
        seconds: 10

    - name: Listar Stacks ativas
      command: docker stack ls
      register: stack_list
      changed_when: false

    - name: Listar Servicos ativos
      command: docker service ls
      register: service_list
      changed_when: false

    - name: Mostrar resultado
      debug:
        msg:
          - "=== STACKS ==="
          - "{{ stack_list.stdout_lines }}"
          - "=== SERVICES ==="
          - "{{ service_list.stdout_lines }}"
