---
- name: Instalar Docker Engine em todos os nós
  hosts: swarm
  become: true
  gather_facts: true

  tasks:
    # =========================================================================
    # 1. Dependências
    # =========================================================================
    - name: Instalar dependências
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Criar diretório keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Adicionar chave GPG do Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Ajustar permissões
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Adicionar repositório Docker
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Atualizar cache apt
      apt:
        update_cache: yes

    # =========================================================================
    # 2. Instalação do Docker
    # =========================================================================
    - name: Instalar Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Habilitar e iniciar Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Adicionar usuário ao grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # =========================================================================
    # 3. TCP Keepalive para Docker Swarm
    # =========================================================================
    - name: Configurar TCP keepalive para Docker Swarm
      copy:
        dest: /etc/sysctl.d/99-tcp-keepalive.conf
        content: |
          # TCP Keepalive para Docker Swarm
          # Detecta nós caídos em ~12 min (padrão do kernel: 2h)
          #
          # tcp_keepalive_time: tempo de inatividade antes do primeiro probe
          # tcp_keepalive_intvl: intervalo entre probes
          # tcp_keepalive_probes: número de probes antes de declarar morto
          #
          # Detecção total: 600 + (30 * 5) = 750s = 12.5 min
          net.ipv4.tcp_keepalive_time = 600
          net.ipv4.tcp_keepalive_intvl = 30
          net.ipv4.tcp_keepalive_probes = 5
      notify: reload sysctl

    # =========================================================================
    # 4. Verificação
    # =========================================================================
    - name: Verificar versão do Docker
      command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Mostrar versão do Docker
      debug:
        msg: "{{ docker_version_output.stdout }}"

    - name: Verificar keepalive aplicado
      command: sysctl net.ipv4.tcp_keepalive_time
      register: keepalive_check
      changed_when: false

    - name: Mostrar keepalive
      debug:
        msg: "{{ keepalive_check.stdout }}"

  handlers:
    - name: reload sysctl
      command: sysctl --system
