---
- name: 23 - Instala Prometheus no Cluster Kubernetes
  hosts: k8s_control_planes
  become: true
  tasks:
    - name: Garantir resolucao DNS/hosts para k8s-api.nverse.local
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "10.0.39.50 k8s-api.nverse.local"
        state: present

    - name: Garantir pasta de manifestos no control-plane
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/manifests"
        state: directory
        mode: '0755'

    - name: Copiar manifesto prometheus.yaml para o control-plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../manifests/prometheus.yaml"
        dest: "{{ ansible_facts['env']['HOME'] }}/manifests/prometheus.yaml"
        mode: '0644'

    - name: Aplicar manifesto do Prometheus no cluster
      ansible.builtin.command:
        cmd: kubectl apply -f {{ ansible_facts['env']['HOME'] }}/manifests/prometheus.yaml
      register: prometheus_apply
      changed_when: "'created' in prometheus_apply.stdout or 'configured' in prometheus_apply.stdout"
      run_once: true

    - name: Aguardar rollout do deployment prometheus-server
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/prometheus-server -n monitoring --timeout=120s
      changed_when: false
      run_once: true

    - name: Exibir status da instalacao
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "         PROMETHEUS SERVER INSTALADO COM SUCESSO          "
          - "=========================================================="
          - "Namespace: monitoring"
          - "Servico:   prometheus-service.monitoring.svc.cluster.local:9090"
          - "=========================================================="
      run_once: true
