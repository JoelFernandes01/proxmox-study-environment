---
- name: 11 - Instalar e Configurar Metrics Server
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin-local.conf"
    control_plane_01_ip: "10.0.39.43"
    metrics_server_url: "https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.1/components.yaml"

  tasks:
    - name: Aplicar manifesto do Metrics Server (Conectando diretamente no IP do CP-01)
      ansible.builtin.command: >
        kubectl apply --kubeconfig={{ kubeconfig_path }} --server=https://{{ control_plane_01_ip }}:6443 --validate=false -f {{ metrics_server_url }}
      register: metrics_apply
      until: metrics_apply.rc == 0
      retries: 5
      delay: 5

    - name: Aplicar patch de TLS inseguro para compatibilidade com Kubeadm
      ansible.builtin.command: >
        kubectl patch deployment metrics-server -n kube-system --kubeconfig={{ kubeconfig_path }} --server=https://{{ control_plane_01_ip }}:6443 --type=json -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
      register: patch_output
      until: patch_output.rc == 0
      retries: 5
      delay: 5

    - name: Aguardar a conclusao do rollout do Metrics Server
      ansible.builtin.command: >
        kubectl rollout status deployment/metrics-server -n kube-system --kubeconfig={{ kubeconfig_path }} --server=https://{{ control_plane_01_ip }}:6443 --timeout=180s
      changed_when: false
