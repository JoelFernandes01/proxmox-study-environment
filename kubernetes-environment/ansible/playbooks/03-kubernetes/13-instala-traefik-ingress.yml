---
- name: 13 - Instala Traefik Ingress Controller via Helm
  hosts: k8s-control-plane-01
  become: true
  vars:
    traefik_namespace: "traefik"
    helm_repo_url: "https://helm.traefik.io/traefik"
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    dashboard_domain: "traefik-k8s.nverse.local"

  tasks:
    - name: Adicionar repositorio Helm do Traefik
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: "{{ helm_repo_url }}"

    - name: Implantar Chart Helm do Traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: "{{ traefik_namespace }}"
        create_namespace: true
        state: present
        wait: yes
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          ingressRoute:
            dashboard:
              enabled: true

    - name: Obter IP do servico Traefik via kubectl
      ansible.builtin.command: >
        kubectl get svc traefik -n {{ traefik_namespace }}
        --kubeconfig={{ kubeconfig_path }}
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: traefik_ip
      changed_when: false

    - name: Criar IngressRoute para o Dashboard do Traefik K8s
      ansible.builtin.copy:
        dest: /tmp/traefik-dashboard-ingress.yaml
        content: |
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: traefik-dashboard
            namespace: {{ traefik_namespace }}
          spec:
            entryPoints:
              - web
            routes:
              - match: Host(`{{ dashboard_domain }}`)
                kind: Rule
                services:
                  - name: api@internal
                    kind: TraefikService

    - name: Aplicar IngressRoute do Dashboard no Kubernetes (com retry)
      ansible.builtin.command: >
        kubectl apply -f /tmp/traefik-dashboard-ingress.yaml
        --kubeconfig={{ kubeconfig_path }}
      register: dashboard_apply
      until: dashboard_apply.rc == 0
      retries: 5
      delay: 3

    - name: Remover manifesto temporario do IngressRoute
      ansible.builtin.file:
        path: /tmp/traefik-dashboard-ingress.yaml
        state: absent

    - name: Exibir instrucoes de acesso ao Traefik
      ansible.builtin.debug:
        msg:
          - "Traefik Ingress Controller ativo no IP: {{ traefik_ip.stdout | default('Pendente') }}"
          - "Adicione no /etc/hosts: {{ traefik_ip.stdout | default('IP_METAL_LB') }} {{ dashboard_domain }}"
          - "Acesse o Dashboard em: http://{{ dashboard_domain }}/dashboard/"
