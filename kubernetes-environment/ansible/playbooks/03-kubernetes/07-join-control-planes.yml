---
- name: Obter token e certificate-key no control-plane principal
  hosts: k8s-control-plane-01
  become: true
  gather_facts: false
  tasks:
    - name: Gerar certificate-key para control-plane
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: cert_output

    - name: Gerar join command basico
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd_basic

    - name: Definir comando de join do control plane em memoria
      ansible.builtin.set_fact:
        join_control_plane_cmd: "{{ join_cmd_basic.stdout }} --control-plane --certificate-key {{ cert_output.stdout_lines[-1] }}"

- name: 07 - Adicionar Control Planes secundarios ao cluster com limpeza previa
  hosts: k8s_control_planes
  become: true
  gather_facts: true
  vars:
    ansible_user_name: "connect"
  tasks:
    - name: Limpar dados legados do Kubeadm e etcd antes do join
      ansible.builtin.shell: |
        kubeadm reset -f || true
        systemctl stop kubelet || true
        crictl rm -f $(crictl ps -a -q) 2>/dev/null || true
        rm -rf /etc/kubernetes/manifests/*
        rm -rf /etc/kubernetes/pki/*
        rm -rf /var/lib/etcd/*
        rm -rf /var/lib/kubelet/*
        rm -rf /etc/cni/net.d/*
        rm -rf /home/{{ ansible_user_name }}/.kube /root/.kube
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X
      when: inventory_hostname != 'k8s-control-plane-01'
      changed_when: false

    - name: Executar kubeadm join nos Control Planes secundarios
      ansible.builtin.command: "{{ hostvars['k8s-control-plane-01']['join_control_plane_cmd'] }}"
      when: inventory_hostname != 'k8s-control-plane-01'

    - name: Criar ~/.kube para o usuario connect
      ansible.builtin.file:
        path: "/home/{{ ansible_user_name }}/.kube"
        state: directory
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: '0755'

    - name: Copiar kubeconfig para o usuario connect
      ansible.builtin.copy:
        src: /etc/kubernetes/admin-local.conf
        dest: "/home/{{ ansible_user_name }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: '0600'
