---
- name: 09 - Instala CNI Calico no Cluster Kubernetes
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin-local.conf"
    control_plane_01_ip: "10.0.39.43"
    calico_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml"

  tasks:
    - name: Aguardar API Server do CP-01 estar operacional
      ansible.builtin.command: >
        kubectl get nodes --kubeconfig={{ kubeconfig_path }} --server=https://{{ control_plane_01_ip }}:6443
      register: apiserver_check
      until: apiserver_check.rc == 0
      retries: 10
      delay: 5
      changed_when: false

    - name: Baixar manifesto do Calico CNI
      ansible.builtin.get_url:
        url: "{{ calico_url }}"
        dest: /tmp/calico.yaml
        mode: '0644'

    - name: Aplicar manifesto do Calico CNI (Conectando diretamente no IP do CP-01)
      ansible.builtin.command: >
        kubectl apply --kubeconfig={{ kubeconfig_path }} --server=https://{{ control_plane_01_ip }}:6443 --validate=false -f /tmp/calico.yaml
      register: calico_install
      until: calico_install.rc == 0
      retries: 5
      delay: 5

    - name: Remover manifesto temporario do Calico
      ansible.builtin.file:
        path: /tmp/calico.yaml
        state: absent
