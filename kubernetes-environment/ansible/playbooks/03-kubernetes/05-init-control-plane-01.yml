---
- name: 05 - Inicializa Control Plane Principal (k8s-control-plane-01)
  hosts: k8s-control-plane-01
  become: yes
  vars:
    control_plane_endpoint: "10.0.39.50:6443"
    pod_network_cidr: "192.168.0.0/16"
    ansible_user_name: "connect"

  tasks:
    - name: Executar limpeza preventiva completa do Kubeadm e etcd
      ansible.builtin.shell: |
        kubeadm reset -f || true
        systemctl stop kubelet || true
        crictl rm -f $(crictl ps -a -q) 2>/dev/null || true
        rm -rf /etc/kubernetes/manifests/*
        rm -rf /etc/kubernetes/pki/*
        rm -rf /var/lib/etcd/*
        rm -rf /var/lib/kubelet/*
        rm -rf /etc/cni/net.d/*
        rm -rf /home/{{ ansible_user_name }}/.kube /root/.kube
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X
      changed_when: false

    - name: Inicializar o cluster Kubernetes com Kubeadm
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint="{{ control_plane_endpoint }}"
        --upload-certs
        --pod-network-cidr="{{ pod_network_cidr }}"
      register: kubeadm_init_output

    - name: Criar diretorio .kube para o usuario root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0750'

    - name: Copiar admin.conf para o usuario root
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    - name: Criar diretorio .kube para o usuario connect
      ansible.builtin.file:
        path: "/home/{{ ansible_user_name }}/.kube"
        state: directory
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: '0755'

    - name: Copiar admin.conf para o usuario connect
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user_name }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: '0600'
