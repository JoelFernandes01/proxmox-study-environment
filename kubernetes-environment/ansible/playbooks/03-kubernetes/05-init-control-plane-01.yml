---
- name: 05 - Inicializa Control Plane Principal (k8s-control-plane-01) v1.37
  hosts: k8s-control-plane-01
  become: yes
  vars:
    control_plane_endpoint: "10.0.39.50:6443"
    pod_network_cidr: "192.168.0.0/16"
    ansible_user_name: "connect"
    kubernetes_version: "v1.37.0"

  tasks:
    - name: Executar limpeza preventiva do Kubeadm e etcd
      ansible.builtin.command:
        cmd: kubeadm reset -f
      failed_when: false

    - name: Inicializar o cluster Kubernetes v1.37 com Kubeadm
      ansible.builtin.command: >
        kubeadm init
        --kubernetes-version="{{ kubernetes_version }}"
        --control-plane-endpoint="{{ control_plane_endpoint }}"
        --upload-certs
        --pod-network-cidr="{{ pod_network_cidr }}"

    - name: Criar admin-local.conf apontando diretamente para o IP do CP-01
      ansible.builtin.command: >
        sed 's|10.0.39.50:6443|10.0.39.43:6443|g' /etc/kubernetes/admin.conf
      register: admin_local
      changed_when: false

    - name: Criar diretorio .kube para o usuario root e connect
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /root/.kube
        - "/home/{{ ansible_user_name }}/.kube"

    - name: Copiar admin.conf para a pasta .kube
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ item }}/config"
        remote_src: true
        mode: '0600'
      loop:
        - /root/.kube
        - "/home/{{ ansible_user_name }}/.kube"
