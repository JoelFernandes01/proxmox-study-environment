---
- name: 04 - Prepara Prerequisitos do Kubernetes em Todos os Nos
  hosts: k8s_control_planes:k8s_workers
  become: yes
  vars:
    crictl_version: "v1.30.0"
    containerd_socket: "unix:///run/containerd/containerd.sock"

  tasks:
    - name: Desativar SWAP temporariamente
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Desativar SWAP permanentemente no /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Carregar modulos do kernel necessarios (overlay, br_netfilter)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Ativar modulos do kernel imediatamente
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configurar parametros sysctl para o Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/k8s.conf
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: Instalar pacotes base e dependencias
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - tar
          - wget
        state: present
        update_cache: yes

    - name: Baixar e instalar a ferramenta crictl em /usr/local/bin
      ansible.builtin.unarchive:
        src: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: yes
        mode: '0755'

    - name: Criar arquivo de configuracao /etc/crictl.yaml
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: {{ containerd_socket }}
          image-endpoint: {{ containerd_socket }}
          timeout: 10
          debug: false
        mode: '0644'

    - name: Instalar containerd e pacotes do Kubernetes (kubelet, kubeadm, kubectl)
      ansible.builtin.apt:
        name:
          - containerd
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Garante diretorio de configuracao do containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory

    - name: Gerar configuracao padrao do containerd com SystemdCgroup = true
      ansible.builtin.shell: |
        containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/g' > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Reiniciar e habilitar o servico containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Habilitar o servico kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes
