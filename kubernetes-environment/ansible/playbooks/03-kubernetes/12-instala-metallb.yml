---
- name: 12 - Instala e Configura MetalLB LoadBalancer via Helm
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    metallb_namespace: "metallb-system"
    helm_repo_url: "https://metallb.github.io/metallb"

  tasks:
    - name: Adicionar repositorio Helm do MetalLB
      kubernetes.core.helm_repository:
        name: metallb
        repo_url: "{{ helm_repo_url }}"

    - name: Implantar Chart Helm do MetalLB
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb/metallb
        release_namespace: "{{ metallb_namespace }}"
        create_namespace: true
        state: present
        wait: yes
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Criar configuracao de IPAddressPool e L2Advertisement
      ansible.builtin.copy:
        dest: /tmp/metallb-config.yaml
        content: |
          ---
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: first-pool
            namespace: metallb-system
          spec:
            addresses:
              - 10.0.39.200-10.0.39.250
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2-advertisement
            namespace: metallb-system
          spec:
            ipAddressPools:
              - first-pool

    - name: Aplicar configuracao do MetalLB no Kubernetes
      ansible.builtin.command: >
        kubectl apply -f /tmp/metallb-config.yaml
        --kubeconfig={{ kubeconfig_path }}
        --validate=false

    - name: Remover manifesto temporario do MetalLB
      ansible.builtin.file:
        path: /tmp/metallb-config.yaml
        state: absent
