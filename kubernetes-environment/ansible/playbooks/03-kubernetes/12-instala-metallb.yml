---
- name: 12 - Instala e Configura MetalLB LoadBalancer via Helm
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    metallb_namespace: "metallb-system"

  tasks:
    - name: Adicionar repositorio Helm do MetalLB
      kubernetes.core.helm_repository:
        name: metallb
        repo_url: "https://metallb.github.io/metallb"

    - name: Implantar Chart Helm do MetalLB
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb/metallb
        release_namespace: "{{ metallb_namespace }}"
        create_namespace: true
        state: present
        wait: yes
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Aguardar pods do MetalLB ficarem Prontos (Ready)
      ansible.builtin.command: >
        kubectl wait --namespace {{ metallb_namespace }}
        --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller
        --timeout=120s
        --kubeconfig={{ kubeconfig_path }}
      changed_when: false

    - name: Criar configuracao de IOAddressPool e L2Advertisement
      ansible.builtin.copy:
        dest: /tmp/metallb-config.yaml
        content: |
          ---
          apiVersion: metallb.io/v1beta1
          kind: IOAddressPool
          metadata:
            name: first-pool
            namespace: metallb-system
          spec:
            addresses:
              - 10.0.39.200-10.0.39.250
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2-advertisement
            namespace: metallb-system
          spec:
            ipAddressPools:
              - first-pool

    - name: Aplicar configuracao do MetalLB no Kubernetes (com retry)
      ansible.builtin.command: >
        kubectl apply -f /tmp/metallb-config.yaml
        --kubeconfig={{ kubectonfig_path }}
        --validate=false
      register: metallb_config_apply
      until: metallb_config_apply.rc == 0
      retries: 10
      delay: 5

    - name: Remover manifesto temporario do MetalLB
      ansible.builtin.file:
        path: /tmp/metallb-config.yaml
        state: absent