---
- name: 00 - Preparacao Base do Sistema Operacional Ubuntu para Kubernetes
  hosts: all
  become: yes
  tasks:
    - name: Desativar SWAP temporariamente
      ansible.builtin.shell: swapoff -a
      failed_when: false

    - name: Remover SWAP permanentemente do fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\s+swap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Carregar modulos do kernel (overlay e br_netfilter)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Modprobe overlay e br_netfilter
      ansible.builtin.shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Configurar parametros do sysctl para Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Aplicar sysctl
      ansible.builtin.shell: sysctl --system

    - name: Instalar pacotes essenciais e o shell Fish
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - software-properties-common
          - fish
        state: present
        update_cache: yes

    - name: Definir Fish como shell padrao para os usuarios
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /usr/bin/fish
      loop:
        - "{{ ansible_user | default('connect') }}"
        - root

    - name: Configurar autocomplete do kubectl e helm no Fish Shell (global)
      ansible.builtin.copy:
        dest: /etc/fish/config.fish
        content: |
          if status is-interactive
              # Autocomplete kubectl e helm
              if type -q kubectl
                  kubectl completion fish | source
              end
              if type -q helm
                  helm completion fish | source
              end
          end
