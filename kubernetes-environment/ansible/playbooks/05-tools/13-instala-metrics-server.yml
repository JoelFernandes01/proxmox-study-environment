---
- name: 13 - Instala e Configura Metrics Server (Resiliente para Esteira)
  hosts: k8s-control-plane-01
  become: false
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    metrics_url: "https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml"

  tasks:
    - name: Baixar manifesto oficial do Metrics Server
      ansible.builtin.get_url:
        url: "{{ metrics_url }}"
        dest: /tmp/metrics-server-components.yaml
        mode: '0644'

    - name: Adicionar flag --kubelet-insecure-tls no manifesto do Metrics Server
      ansible.builtin.replace:
        path: /tmp/metrics-server-components.yaml
        regexp: '(- --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname)'
        replace: '\1\n        - --kubelet-insecure-tls'

    - name: Aplicar manifesto do Metrics Server no Kubernetes (com Retry)
      ansible.builtin.command: >
        kubectl apply -f /tmp/metrics-server-components.yaml
        --kubeconfig={{ kubeconfig_path }}
      register: metrics_apply
      until: metrics_apply.rc == 0
      retries: 5
      delay: 5

    - name: Aguardar a conclusao do rollout do Metrics Server (Nao bloqueia a esteira)
      ansible.builtin.command: >
        kubectl rollout status deployment/metrics-server -n kube-system
        --kubeconfig={{ kubeconfig_path }} --timeout=180s
      register: rollout_status
      failed_when: false
      changed_when: false

    - name: Notificar status da implantacao do Metrics Server
      ansible.builtin.debug:
        msg: >
          {{
            'Metrics Server ativado e operando com sucesso!'
            if rollout_status.rc == 0
            else 'Metrics Server implantado, mas o rollout ainda esta finalizando em segundo plano. A esteira prosseguira normalmente.'
          }}

    - name: Remover manifesto temporario do Metrics Server
      ansible.builtin.file:
        path: /tmp/metrics-server-components.yaml
        state: absent
