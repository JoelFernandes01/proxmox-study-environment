---
- name: 11 - Instala Portainer Agent (Com Headless Service)
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    portainer_namespace: "portainer"

  tasks:
    - name: Garantir dependencias de Python no no de controle (opcional para kubernetes.core)
      ansible.builtin.apt:
        name:
          - python3-kubernetes
          - python3-yaml
        state: present
      ignore_errors: yes

    - name: Aplicar manifesto completo do Portainer Agent via kubectl
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply --kubeconfig={{ kubeconfig_path }} -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ portainer_namespace }}
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: portainer-agent-sa
          namespace: {{ portainer_namespace }}
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: portainer-agent-binding
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: portainer-agent-sa
            namespace: {{ portainer_namespace }}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: portainer-agent-headless
          namespace: {{ portainer_namespace }}
          labels:
            app: portainer-agent
        spec:
          clusterIP: None
          selector:
            app: portainer-agent
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: portainer-agent
          namespace: {{ portainer_namespace }}
        spec:
          type: LoadBalancer
          ports:
            - port: 9001
              targetPort: 9001
              name: http
          selector:
            app: portainer-agent
        ---
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: portainer-agent
          namespace: {{ portainer_namespace }}
          labels:
            app: portainer-agent
        spec:
          selector:
            matchLabels:
              app: portainer-agent
          template:
            metadata:
              labels:
                app: portainer-agent
            spec:
              serviceAccountName: portainer-agent-sa
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: portainer-agent
                  image: portainer/agent:2.21.5
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: KUBERNETES_POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: AGENT_CLUSTER_ADDR
                      value: "portainer-agent-headless"
                  ports:
                    - containerPort: 9001
                      name: http
        EOF
      args:
        executable: /bin/bash
