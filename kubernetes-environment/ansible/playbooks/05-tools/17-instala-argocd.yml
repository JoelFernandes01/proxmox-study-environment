---
- name: 17 - Instala e Configura ArgoCD GitOps Engine (Resiliente para Esteira)
  hosts: k8s-control-plane-01
  become: false
  vars:
    argocd_namespace: "argocd"
    argocd_domain: "argocd.nverse.local"
    kubeconfig_path: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Garantir que o Helm esteja instalado no CP-01
      ansible.builtin.shell: |
        if ! command -v helm &> /dev/null; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      become: true
      register: helm_install_check
      changed_when: "'Downloading' in helm_install_check.stdout or 'Installing' in helm_install_check.stdout"

    - name: Criar namespace argocd (com retry para resiliencia do kube-apiserver)
      ansible.builtin.command:
        cmd: kubectl create namespace {{ argocd_namespace }}
      register: create_ns
      until: create_ns.rc == 0 or 'already exists' in create_ns.stderr
      retries: 5
      delay: 5
      failed_when: create_ns.rc != 0 and 'already exists' not in create_ns.stderr
      changed_when: create_ns.rc == 0

    - name: Adicionar repositorio Helm do Argo Project
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout or 'already exists' in helm_repo.stdout"

    - name: Atualizar repositorios Helm
      ansible.builtin.command:
        cmd: helm repo update

    - name: Instalar ou Atualizar ArgoCD via Helm (Forcando --insecure no Container do ArgoCD Server)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install argocd argo/argo-cd
          --namespace {{ argocd_namespace }}
          --set server.ingress.enabled=false
          --set server.insecure=true
          --set configs.params."server.insecure"="true"
          --set "server.extraArgs[0]=--insecure"
      register: helm_install
      until: helm_install.rc == 0
      retries: 5
      delay: 15
      changed_when: "'STATUS: deployed' in helm_install.stdout or 'upgraded' in helm_install.stdout"

    - name: Forcar argumento --insecure no Deployment do argocd-server se necessario
      ansible.builtin.shell: |
        kubectl patch deployment argocd-server -n {{ argocd_namespace }} --type json -p='[{"op": "add", "path": "/spec/template/spec/containers/0/command/-", "value": "--insecure"}]' 2>/dev/null || true
      failed_when: false
      changed_when: false

    - name: Aguardar Deployment do ArgoCD Server estar Ready
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/argocd-server -n {{ argocd_namespace }} --timeout=300s
      register: argocd_rollout
      until: argocd_rollout.rc == 0
      retries: 3
      delay: 20
      failed_when: false
      changed_when: false

    - name: Remover IngressRoute e Ingress antigos se existirem
      ansible.builtin.command:
        cmd: kubectl delete ingressroute argocd-server-ingress -n {{ argocd_namespace }} --ignore-not-found
      failed_when: false
      changed_when: false

    - name: Aplicar Ingress Padrao do Kubernetes para o ArgoCD (Web e Websecure)
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: argocd-server-ingress
          namespace: {{ argocd_namespace }}
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
            ingress.kubernetes.io/ssl-redirect: "false"
        spec:
          ingressClassName: traefik
          rules:
            - host: {{ argocd_domain }}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: argocd-server
                        port:
                          number: 80
            - host: argocd
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: argocd-server
                        port:
                          number: 80
        EOF
      register: apply_ingress
      until: apply_ingress.rc == 0
      retries: 5
      delay: 3
      failed_when: false
      changed_when: "'configured' in apply_ingress.stdout or 'created' in apply_ingress.stdout"

    - name: Obter a senha inicial de admin do ArgoCD
      ansible.builtin.shell: |
        kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      until: argocd_password.rc == 0
      retries: 6
      delay: 10
      failed_when: false
      changed_when: false

    - name: Exibir credenciais iniciais de acesso
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "ArgoCD instalado com sucesso!"
          - "URL de Acesso: http://{{ argocd_domain }}"
          - "Usuario: admin"
          - "Senha Inicial: {{ argocd_password.stdout | default('Ja alterada ou secret em geracao') }}"
          - "===================================================="
