---
- name: 17 - Instala e Configura ArgoCD GitOps Engine (Resiliente para Esteira)
  hosts: k8s-control-plane-01
  become: false
  vars:
    argocd_namespace: "argocd"
    argocd_domain: "argocd.nverse.local"
    kubeconfig_path: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Garantir que o Helm esteja instalado no CP-01
      ansible.builtin.shell: |
        if ! command -v helm &> /dev/null; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      become: true
      register: helm_install_check
      changed_when: "'Downloading' in helm_install_check.stdout or 'Installing' in helm_install_check.stdout"

    - name: Criar namespace argocd
      ansible.builtin.command:
        cmd: kubectl create namespace {{ argocd_namespace }}
      register: create_ns
      failed_when: create_ns.rc != 0 and 'already exists' not in create_ns.stderr
      changed_when: create_ns.rc == 0

    - name: Adicionar repositorio Helm do Argo Project
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout or 'already exists' in helm_repo.stdout"

    - name: Atualizar repositorios Helm
      ansible.builtin.command:
        cmd: helm repo update

    - name: Instalar ou Atualizar ArgoCD via Helm (Modo Insecure e Desativa Ingress nativo do Chart)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install argocd argo/argo-cd
          --namespace {{ argocd_namespace }}
          --set server.ingress.enabled=false
          --set server.insecure=true
          --set configs.params."server\.insecure"=true
      register: helm_install
      until: helm_install.rc == 0
      retries: 5
      delay: 15
      changed_when: "'STATUS: deployed' in helm_install.stdout or 'upgraded' in helm_install.stdout"

    - name: Aguardar Deployment do ArgoCD Server estar Ready (Nao trava a esteira)
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/argocd-server -n {{ argocd_namespace }} --timeout=300s
      register: argocd_rollout
      until: argocd_rollout.rc == 0
      retries: 3
      delay: 20
      failed_when: false
      changed_when: false

    - name: Obter IP do LoadBalancer Traefik (para log de confirmacao)
      ansible.builtin.command: >
        kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: traefik_ip_check
      failed_when: false
      changed_when: false

    - name: Aplicar IngressRoute do Traefik para o ArgoCD Server (Dominio + Fallback de IP)
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: argocd-server-ingress
          namespace: {{ argocd_namespace }}
        spec:
          entryPoints:
            - web
            - websecure
          routes:
            - match: Host(`{{ argocd_domain }}`) || PathPrefix(`/`)
              kind: Rule
              services:
                - name: argocd-server
                  port: 80
        EOF
      register: apply_ingress_route
      until: apply_ingress_route.rc == 0
      retries: 5
      delay: 3
      failed_when: false
      changed_when: "'configured' in apply_ingress_route.stdout or 'created' in apply_ingress_route.stdout"

    - name: Aplicar Ingress Padrao Kubernetes como fallback universal
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: argocd-server-standard-ingress
          namespace: {{ argocd_namespace }}
          annotations:
            ingress.kubernetes.io/ssl-redirect: "false"
            traefik.ingress.kubernetes.io/router.entrypoints: web
        spec:
          ingressClassName: traefik
          rules:
            - host: {{ argocd_domain }}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: argocd-server
                        port:
                          number: 80
            - http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: argocd-server
                        port:
                          number: 80
        EOF
      register: apply_std_ingress
      until: apply_std_ingress.rc == 0
      retries: 5
      delay: 3
      failed_when: false
      changed_when: true

    - name: Obter a senha inicial de admin do ArgoCD
      ansible.builtin.shell: |
        kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      until: argocd_password.rc == 0
      retries: 6
      delay: 10
      failed_when: false
      changed_when: false

    - name: Exibir credenciais e URLs de acesso
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "ArgoCD instalado e exposto com sucesso!"
          - "Acesso por Dominio: http://{{ argocd_domain }}"
          - "Acesso por IP Direto: http://{{ traefik_ip_check.stdout | default('10.0.39.201') }}"
          - "Usuario: admin"
          - "Senha Inicial: {{ argocd_password.stdout | default('Ja alterada ou secret em geracao') }}"
          - "===================================================="
