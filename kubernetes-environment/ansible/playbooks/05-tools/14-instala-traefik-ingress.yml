---
- name: 14 - Instala Traefik Ingress Controller via Helm (Resiliente)
  hosts: k8s_control_plane_01
  become: false
  vars:
    traefik_namespace: "traefik"
    kubeconfig_path: "/etc/kubernetes/admin-local.conf"
    dashboard_domain: "traefik.infra.local"

  tasks:
    - name: Adicionar repositorio Helm do Traefik
      ansible.builtin.command:
        cmd: helm repo add traefik https://helm.traefik.io/traefik
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout or 'already exists' in repo_add.stdout"

    - name: Atualizar repositorios Helm
      ansible.builtin.command:
        cmd: helm repo update

    - name: Implantar Chart Helm do Traefik (com timeout ampliado e retry)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install traefik traefik/traefik
          --namespace traefik
          --create-namespace
          --set ingressRoute.dashboard.enabled=true
          --timeout 10m0s
          --wait
      register: helm_install
      until: helm_install.rc == 0
      retries: 3
      delay: 15
      changed_when: "'STATUS: deployed' in helm_install.stdout or 'upgraded' in helm_install.stdout"

    - name: Aguardar o Deployment do Traefik estar em estado Ready
      ansible.builtin.command: >
        kubectl rollout status deployment/traefik -n {{ traefik_namespace }}
        --kubeconfig={{ kubeconfig_path }} --timeout=300s
      changed_when: false

    - name: Obter IP do servico Traefik via kubectl
      ansible.builtin.command: >
        kubectl get svc traefik -n {{ traefik_namespace }}
        --kubeconfig={{ kubeconfig_path }}
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: traefik_ip
      changed_when: false

    - name: Criar IngressRoute para o Dashboard do Traefik K8s
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: traefik-dashboard
          namespace: {{ traefik_namespace }}
        spec:
          entryPoints:
            - web
          routes:
            - match: Host(`{{ dashboard_domain }}`)
              kind: Rule
              services:
                - name: api@internal
                  kind: TraefikService
        EOF
      register: dashboard_apply
      until: dashboard_apply.rc == 0
      retries: 5
      delay: 3

    - name: Exibir instrucoes de acesso ao Traefik
      ansible.builtin.debug:
        msg:
          - "Traefik Ingress Controller ativo no IP: {{ traefik_ip.stdout | default('Pendente') }}"
          - "Adicione no /etc/hosts: {{ traefik_ip.stdout | default('IP_METAL_LB') }} {{ dashboard_domain }}"
          - "Acesse o Dashboard em: http://{{ dashboard_domain }}/dashboard/"
