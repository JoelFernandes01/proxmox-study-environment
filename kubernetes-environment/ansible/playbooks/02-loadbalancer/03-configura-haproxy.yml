---
- name: 03 - Configura HAProxy para API Server do Kubernetes (TCP Passthrough L4)
  hosts: k8s_haproxy
  become: yes
  tasks:
    - name: Habilitar ip_nonlocal_bind no sysctl
      ansible.builtin.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: yes

    - name: Instalar HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configurar /etc/haproxy/haproxy.cfg
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon

          defaults
              log     global
              mode    tcp
              option  tcplog
              option  dontlognull
              timeout connect 5s
              timeout client  50s
              timeout server  50s

          frontend k8s-api-frontend
              bind 10.0.39.50:6443
              mode tcp
              option tcplog
              default_backend k8s-api-backend

          backend k8s-api-backend
              mode tcp
              option tcp-check
              balance roundrobin
              default-server inter 3s fall 2 rise 2
              server k8s-control-plane-01 10.0.39.43:6443 check
              server k8s-control-plane-02 10.0.39.44:6443 check
              server k8s-control-plane-03 10.0.39.45:6443 check
        owner: root
        group: root
        mode: '0644'
      notify: Restart HAProxy

  handlers:
    - name: Restart HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
        enabled: yes
