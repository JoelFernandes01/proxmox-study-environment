---
- name: Preparar sistema para Kubernetes (Swap, Módulos do Kernel, Containerd, Kubelet)
  hosts: all
  become: true
  tasks:
    - name: Desabilitar swap imediatamente
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remover entrada do swap no /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Configurar modulos do kernel
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Carregar modulos do kernel
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ajustar parametros sysctl do kernel
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Instalar containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Criar diretorio do containerd
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Gerar configuracao padrao do containerd
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Habilitar SystemdCgroup no containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Reiniciar containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Adicionar chave GPG do repositorio do Kubernetes
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Adicionar repositorio do Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /\n"
        mode: '0644'

    - name: Instalar kubelet, kubeadm e kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: yes

    - name: Bloquear atualizacoes automaticas do Kubernetes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]
