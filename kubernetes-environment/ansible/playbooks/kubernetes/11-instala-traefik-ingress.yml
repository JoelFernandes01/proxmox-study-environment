---
- name: 11 - Instala Traefik Ingress Controller via Helm
  hosts: k8s-control-plane-01
  become: yes
  vars:
    traefik_namespace: "traefik"
    helm_repo_url: "https://helm.traefik.io/traefik"
    kubeconfig_path: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Adicionar repositorio Helm do Traefik
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: "{{ helm_repo_url }}"

    - name: Implantar Chart Helm do Traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: "{{ traefik_namespace }}"
        create_namespace: true
        state: present
        wait: yes
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          ingressRoute:
            dashboard:
              enabled: true

    - name: Obter informacoes do servico Traefik
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Service
        name: traefik
        namespace: "{{ traefik_namespace }}"
      register: traefik_service

    - name: Exibir IP do Traefik alocado pelo MetalLB
      ansible.builtin.debug:
        msg: "Traefik Ingress Controller ativo no IP da rede: {{ traefik_service.resources[0].status.loadBalancer.ingress[0].ip | default('Pendente') }}"
