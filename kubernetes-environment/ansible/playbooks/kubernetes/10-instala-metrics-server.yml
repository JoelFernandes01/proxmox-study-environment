---
- name: Instalar e Configurar Metrics Server
  hosts: k8s-control-plane-01
  become: true
  tasks:
    - name: Aplicar manifesto do Metrics Server
      become_user: connect
      environment:
        KUBECONFIG: /home/connect/.kube/config
      ansible.builtin.command: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
      register: metrics_apply
      until: metrics_apply.rc == 0
      retries: 5
      delay: 10

    - name: Aplicar patch de TLS inseguro para compatibilidade com Kubeadm
      become_user: connect
      environment:
        KUBECONFIG: /home/connect/.kube/config
      ansible.builtin.command: >
        kubectl patch deployment metrics-server -n kube-system --type='json'
        -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
      register: metrics_patch
      changed_when: metrics_patch.rc == 0
      ignore_errors: true

    - name: Aguardar a conclusao do rollout do Metrics Server
      become_user: connect
      environment:
        KUBECONFIG: /home/connect/.kube/config
      ansible.builtin.command: kubectl rollout status deployment metrics-server -n kube-system --timeout=60s
      register: metrics_rollout
      changed_when: false
      ignore_errors: true
