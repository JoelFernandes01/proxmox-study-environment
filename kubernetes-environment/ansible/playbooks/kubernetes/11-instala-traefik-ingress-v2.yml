---
- name: 11 - Instala Traefik Ingress Controller via Helm
  yosts: k8s-control-plane-01
  become: yes
  tasks:
    - name: Adiciona o repositório Helm do Traefik
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: "https://helm.traefik.io/traefik"

    - name: Instala o Chart do Traefik no namespace traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: traefik
        create_namespace: true
        values:
          ingressRoute:
            dashboard:
              enabled: true
