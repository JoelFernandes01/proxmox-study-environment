---
- name: 13 - Configura ClusterIssuer de CA Interna no Cert-Manager
  hosts: k8s-control-plane-01
  become: yes
  vars:
    cert_manager_namespace: "cert-manager"
    issuer_name: "internal-ca-issuer"
    kubeconfig_path: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Criar manifesto temporario do Self-Signed e CA Issuer
      ansible.builtin.copy:
        dest: /tmp/cluster-issuer-ca.yaml
        content: |
          ---
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: selfsigned-issuer
          spec:
            selfSigned: {}
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: internal-root-ca
            namespace: cert-manager
          spec:
            isCA: true
            commonName: "Nverse Internal Root CA"
            secretName: internal-root-ca-secret
            privateKey:
              algorithm: RSA
              size: 2048
            issuerRef:
              name: selfsigned-issuer
              kind: ClusterIssuer
              group: cert-manager.io
          ---
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: internal-ca-issuer
          spec:
            ca:
              secretName: internal-root-ca-secret

    - name: Aplicar ClusterIssuer e Root CA no Kubernetes via kubectl
      ansible.builtin.command: >
        kubectl apply -f /tmp/cluster-issuer-ca.yaml
        --kubeconfig={{ kubeconfig_path }}

    - name: Remover arquivo manifesto temporario
      ansible.builtin.file:
        path: /tmp/cluster-issuer-ca.yaml
        state: absent

    - name: Validar status do ClusterIssuer interno via kubectl
      ansible.builtin.command: >
        kubectl get clusterissuer {{ issuer_name }}
        --kubeconfig={{ kubeconfig_path }}
      register: issuer_status
      changed_when: false

    - name: Exibir confirmacao de prontidao do Issuer
      ansible.builtin.debug:
        msg: "{{ issuer_status.stdout }}"
