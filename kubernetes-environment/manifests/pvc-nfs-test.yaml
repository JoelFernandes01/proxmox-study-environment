---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-nfs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-nfs-pod
spec:
  containers:
    - name: app
      image: busybox:latest
      command:
        - sh
        - -c
        - "echo 'Teste de escrita no NFS em $(date)' &gt;&gt; /mnt/nfs/teste.txt &amp;&amp; cat /mnt/nfs/teste.txt &amp;&amp; sleep 3600"
      volumeMounts:
        - mountPath: "/mnt/nfs"
          name: nfs-volume
  volumes:
    - name: nfs-volume
      persistentVolumeClaim:
        claimName: test-nfs-pvc
