---
# 1. Namespace para a equipe de desenvolvimento
apiVersion: v1
kind: Namespace
metadata:
  name: desenvolvimento
---
# 2. ServiceAccount (Identidade da aplicação/pipeline/usuário)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-user-sa
  namespace: desenvolvimento
---
# 3. Role (Regras de permissão restritas ao namespace desenvolvimento)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-pod-reader-role
  namespace: desenvolvimento
rules:
  - apiGroups: [""] # Grupo core do K8s
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"] # Leitura e inspeção
---
# 4. RoleBinding (Associação da Role à ServiceAccount)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-pod-reader-binding
  namespace: desenvolvimento
subjects:
  - kind: ServiceAccount
    name: dev-user-sa
    namespace: desenvolvimento
roleRef:
  kind: Role
  name: dev-pod-reader-role
  apiGroup: rbac.authorization.k8s.io
